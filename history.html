<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>history</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 style="color:#133C55;">SafePay</h1>

    <nav >
        <a href="home.html"><b>Home</b></a> 
        <a href="about.html"><b>About</b></a> 
        <a href="profile.html"><b>profile</b></a>
        <a href="contact.html"><b>Contacts</b></a>
        <a href="login.html" style="margin-left:  1400px; "><b>LogOut</b></a>
    </nav>
    </header>

<h2 class="text-center mt-4">Transaction History</h2>

<table>
  <tr>
    <th>Transaction ID</th>
    <th>Date</th>
    <th>Transferred To</th>
    <th>Amount (₹)</th>
    <th>Status</th>
  </tr>
  <tbody id="historyBody"></tbody>
</table>

<script>
const data = JSON.parse(localStorage.getItem("transactions")) || [];
const body = document.getElementById("historyBody");

if (data.length === 0) {
  body.innerHTML = "<tr><td colspan='5'>No Transactions</td></tr>";
}

data.forEach(t => {
  body.innerHTML += `
    <tr>
      <td>${t.id}</td>
      <td>${t.date}</td>
      <td>${t.to}</td>
      <td>${t.amount}</td>
      <td style="color:${t.status === 'Success' ? 'green' : 'red'}">
        ${t.status}
      </td>
    </tr>`;
});
</script>

</body>
</html>
