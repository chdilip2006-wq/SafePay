<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transfer Funds</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>SafePay</h1>
  <nav>
    <a href="home.html">Home</a>
    <a href="about.html">About</a>
    <a href="profile.html">Profile</a>
    <a href="contact.html">Contacts</a>
    <a href="login.html" style="float:right;">Logout</a>
  </nav>
</header>

<form class="text-center p-4">
  <h2>Transfer Funds</h2>

  <input type="text" id="accno" placeholder="Your Account Number"><br><br>
  <input type="text" id="raccno" placeholder="Receiver Account Number"><br><br>
  <input type="number" id="amount" placeholder="Amount"><br><br>
  <input type="password" id="pin" placeholder="PIN"><br><br>

  <button type="button" onclick="transfer()">Send</button>
</form>

<script>
function transfer() {

  const acc = accno.value.trim();
  const racc = raccno.value.trim();
  const amt = Number(amount.value);
  const pinVal = pin.value;

  if (!acc || !racc || amt <= 0 || !pinVal) {
    alert("Fill all fields correctly");
    return;
  }

  if (pinVal !== "123456") {
    alert("Wrong PIN");
    return;
  }

  let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

  transactions.push({
    id: "TXN" + Date.now(),
    date: new Date().toLocaleDateString(),
    to: racc,
    amount: amt,
    status: "Success"
  });

  localStorage.setItem("transactions", JSON.stringify(transactions));
  window.location.href = "history.html";
}
</script>

</body>
</html>
